name: macOS Interactive Session

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  interactive:
    runs-on: macos-15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Tmate Session
        uses: mxschmitt/action-tmate@v3
        with:
          limit-access-to-actor: false
