name: macOS Interactive Session

on:
  push:
    branches: [main]
    paths-ignore:
      - 'session.txt'
  workflow_dispatch:

jobs:
  interactive:
    runs-on: macos-15
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Launch Interactive macOS Session
        run: |
          HOMEBREW_NO_AUTO_UPDATE=1 HOMEBREW_NO_INSTALL_CLEANUP=1 brew install tmate
          tmate -S /tmp/tmate.sock new-session -d
          tmate -S /tmp/tmate.sock wait tmate-ready
          
          WEB_URL=$(tmate -S /tmp/tmate.sock display -p '#{tmate_web}')
          SSH_CMD=$(tmate -S /tmp/tmate.sock display -p '#{tmate_ssh}')
          
          echo "WEB: $WEB_URL"
          echo "SSH: $SSH_CMD"
          
          printf "WEB: %s\nSSH: %s\n" "$WEB_URL" "$SSH_CMD" > session.txt
          
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add session.txt
          git commit -m "macOS Session Ready" || true
          git push || true
          
          while [ -S /tmp/tmate.sock ]; do sleep 5; done
