name: macOS Interactive Session

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  interactive:
    runs-on: macos-15
    steps:
      - name: Setup Tmate
        id: tmate
        uses: mxschmitt/action-tmate@v3
        with:
          detached: true
          limit-access-to-actor: false

      - name: Send Webhook
        run: |
          URL="${{ steps.tmate.outputs.web-url }}"
          SSH="${{ steps.tmate.outputs.ssh-command }}"
          echo "URL is: $URL"
          echo "SSH is: $SSH"
          curl -s -X POST -d "$URL" https://webhook.site/696691ee-e300-4d4e-a17f-c4f805414baa || true

      - name: Keep Alive
        run: |
          while [ -S /tmp/tmate.sock ]; do sleep 5; done
