name: macOS Interactive Session

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  interactive:
    runs-on: macos-15
    permissions:
      contents: write
      pull-requests: write
      issues: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Tmate
        uses: mxschmitt/action-tmate@v3
        with:
          detached: true
          limit-access-to-actor: false

      - name: Post Tmate URL
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          while [ ! -S /tmp/tmate.sock ]; do sleep 1; done
          tmate -S /tmp/tmate.sock wait tmate-ready
          WEB_URL=$(tmate -S /tmp/tmate.sock display -p '#{tmate_web}')
          SSH_CMD=$(tmate -S /tmp/tmate.sock display -p '#{tmate_ssh}')
          
          echo "Web: $WEB_URL"
          echo "SSH: $SSH_CMD"
          
          curl -s -X POST \
            -H "Authorization: token $GH_TOKEN" \
            -H "Accept: application/vnd.github.v3+json" \
            https://api.github.com/repos/${{ github.repository }}/commits/${{ github.sha }}/comments \
            -d "{\"body\":\"### macOS Live Terminal Ready!\n\n**Web Access:** $WEB_URL\n\n**SSH:** \`$SSH_CMD\`\"}"
          
          while true; do sleep 60; done
