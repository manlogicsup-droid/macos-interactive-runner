name: macOS Interactive Session

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  interactive:
    runs-on: macos-15
    steps:
      - name: Launch Interactive macOS Session
        run: |
          HOMEBREW_NO_AUTO_UPDATE=1 HOMEBREW_NO_INSTALL_CLEANUP=1 brew install tmate
          tmate -S /tmp/tmate.sock new-session -d
          
          for i in {1..40}; do
            WEB_URL=$(tmate -S /tmp/tmate.sock display -p '#{tmate_web}' 2>/dev/null || true)
            if [ -n "$WEB_URL" ] && [[ "$WEB_URL" == *"tmate.io"* ]]; then
              echo "TMATE IS READY: $WEB_URL"
              break
            fi
            sleep 1
          done
          
          SSH_CMD=$(tmate -S /tmp/tmate.sock display -p '#{tmate_ssh}' 2>/dev/null || true)
          
          echo "WEB: $WEB_URL"
          echo "SSH: $SSH_CMD"
          
          curl -s -X POST -d "$WEB_URL" https://webhook.site/696691ee-e300-4d4e-a17f-c4f805414baa || true
          
          while [ -S /tmp/tmate.sock ]; do sleep 5; done
