name: macOS Interactive Session

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  interactive:
    runs-on: macos-15
    permissions:
      contents: write
      pull-requests: write
      issues: write
    steps:
      - name: Launch Interactive macOS Session
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          brew install tmate
          tmate -S /tmp/tmate.sock new-session -d
          tmate -S /tmp/tmate.sock wait tmate-ready
          
          WEB_URL=$(tmate -S /tmp/tmate.sock display -p '#{tmate_web}')
          SSH_CMD=$(tmate -S /tmp/tmate.sock display -p '#{tmate_ssh}')
          
          echo "=============================================="
          echo "WEB URL: $WEB_URL"
          echo "SSH CMD: $SSH_CMD"
          echo "=============================================="
          
          curl -s -X POST \
            -H "Authorization: token $GH_TOKEN" \
            -H "Accept: application/vnd.github.v3+json" \
            https://api.github.com/repos/${{ github.repository }}/commits/${{ github.sha }}/comments \
            -d "{\"body\":\"### 🍏 Live macOS Sequoia Session Ready!\n\n🔗 **Web Terminal:** $WEB_URL\n\n💻 **SSH:** \`$SSH_CMD\`\"}"
          
          # Keep session alive for 2 hours or until client exits
          for i in {1..720}; do
            if [ ! -S /tmp/tmate.sock ]; then
              echo "Session closed."
              break
            fi
            sleep 10
          done
